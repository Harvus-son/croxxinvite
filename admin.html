<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Закрытый архив — Ordo Crux</title><link href="https://fonts.googleapis.com/css2?family=Crimson+Text:wght@400;600&family=UnifrakturCook:wght@700&family=MedievalSharp&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;padding:24px 14px;background:radial-gradient(ellipse at top,#65452b,#20140e);color:#2c1810;font:18px 'Crimson Text',serif}.sheet{max-width:1100px;margin:auto;padding:clamp(20px,4vw,44px);background:linear-gradient(90deg,#d0b783,#f4e4bc 9%,#f7e9c7 50%,#e4cb99);border:2px solid #9b7439;box-shadow:0 20px 70px #0009}h1{font:clamp(36px,6vw,58px) UnifrakturCook;text-align:center;color:#722f37;margin:15px 0}p.center{text-align:center}label{display:block;margin:12px 0 5px;color:#722f37}input{width:100%;padding:11px;font:18px 'Crimson Text';background:#fff2d4;border:1px solid #a17b37;color:#2c1810}.btn{padding:11px 18px;margin:12px 8px 12px 0;background:#6b2921;color:#f5dfaa;border:1px solid #d4af37;font:15px MedievalSharp;cursor:pointer}.status{padding:12px;background:#ead7aa;border:1px solid #b49455;white-space:pre-wrap}.hidden{display:none!important}.tablewrap{overflow:auto;margin-top:18px}table{width:100%;border-collapse:collapse;font-size:16px}th,td{text-align:left;padding:10px;border-bottom:1px solid #a17b37;vertical-align:top}th{font:14px MedievalSharp;color:#722f37}td{max-width:260px;overflow-wrap:anywhere}.muted{font-size:14px;color:#705437}a{color:#722f37}</style></head><body><main class="sheet"><p class="center"><a href="index.html">← Вернуться на главную</a></p><h1>Закрытый архив братства</h1><p class="center">Доступ только владельцу. Вход по одноразовой ссылке на почту.</p><section id="login"><label for="email">Административная почта</label><input id="email" type="email" autocomplete="email" placeholder="Твой email"><button id="send" class="btn">Получить ссылку для входа</button><p class="muted">Ссылка отправляется только на адрес, указанный в настройках проекта.</p></section><section id="archive" class="hidden"><p id="signed" class="status"></p><button id="refresh" class="btn">Обновить список</button><button id="logout" class="btn">Выйти</button><button id="export" class="btn">Экспорт CSV</button><label for="search">Поиск по имени, номеру, титулу</label><input id="search" placeholder="Начни вводить..."><div id="status" class="status" role="status">Подключение…</div><div class="tablewrap"><table><thead><tr><th>Номер</th><th>Дата</th><th>Имя / титул</th><th>Герб</th><th>Клятва</th><th>Предпочтения</th><th>Примечания</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js"></script><script>
const ready=window.ORDO_SUPABASE_URL&&window.ORDO_SUPABASE_ANON_KEY&&!window.ORDO_SUPABASE_URL.includes('PASTE_')&&!window.ORDO_SUPABASE_ANON_KEY.includes('PASTE_');
const adminEmail=(window.ORDO_ADMIN_EMAIL||'').trim().toLowerCase();let sb=null,records=[];
const $=id=>document.getElementById(id);function status(t){$('status').textContent=t}
if(!ready){$('login').classList.remove('hidden');$('send').disabled=true;$('email').placeholder='Сначала настрой supabase-config.js';const n=document.createElement('p');n.className='status';n.textContent='Архив ещё не настроен: внеси URL и публичный ключ Supabase в supabase-config.js.';$('login').append(n)}else{sb=window.supabase.createClient(window.ORDO_SUPABASE_URL,window.ORDO_SUPABASE_ANON_KEY);sb.auth.onAuthStateChange(()=>checkSession());checkSession()}
async function checkSession(){if(!sb)return;const {data:{session}}=await sb.auth.getSession();if(session&&session.user.email?.toLowerCase()===adminEmail){$('login').classList.add('hidden');$('archive').classList.remove('hidden');$('signed').textContent='Вошёл как '+session.user.email;load()}else{$('archive').classList.add('hidden');$('login').classList.remove('hidden');if(session){await sb.auth.signOut();status('Этот аккаунт не является администратором.')}}}
$('send').onclick=async()=>{const email=$('email').value.trim().toLowerCase();if(!email||email!==adminEmail){alert('Сие имя не числится среди хранителей архива.');return}const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});alert(error?'Не удалось отправить ссылку: '+error.message:'Ссылка для входа отправлена. Проверь почту.');};
async function load(){status('Загружаю записи…');const {data,error}=await sb.from('knight_registrations').select('*').order('created_at',{ascending:false}).limit(1000);if(error){status('Ошибка доступа к архиву. Проверь email в SQL-политике и настройках Supabase. '+error.message);return}records=data||[];render()}
function render(){const q=$('search').value.trim().toLowerCase();const list=records.filter(r=>[r.member_number,r.knight_name,r.knight_title].join(' ').toLowerCase().includes(q));$('rows').innerHTML='';for(const r of list){const tr=document.createElement('tr');[r.member_number,new Date(r.created_at).toLocaleString(),r.knight_name+' — '+r.knight_title,r.crest,r.oath,(r.drink_preferences||[]).join(', '),r.notes].forEach(v=>{const td=document.createElement('td');td.textContent=v||'—';tr.append(td)});$('rows').append(tr)}status('Записей: '+list.length+' из '+records.length+'.')}
$('refresh').onclick=load;$('search').oninput=render;$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};$('export').onclick=()=>{const esc=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const cols=['member_number','created_at','knight_name','knight_title','crest','oath','drink_preferences','notes'];const csv='\ufeff'+[cols.join(','),...records.map(r=>cols.map(k=>esc(Array.isArray(r[k])?r[k].join('; '):r[k])).join(','))].join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='ordo-crux-registrations.csv';a.click();URL.revokeObjectURL(a.href)};
</script></body></html>
